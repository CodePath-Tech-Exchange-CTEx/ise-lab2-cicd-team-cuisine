<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bet Summary</title>
    <link rel="stylesheet" href="static/style.css">
    <script>
        // Failsafe: Force Streamlit to expand the iframe immediately before external JS even loads
        window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: 800 }, "*");
    </script>
</head>
<body>
    <div class="bet-card">
        <div class="bet-title" id="bet-name"></div>
        <div class="bet-top-row">
            <!-- Image -->
            <div class="bet-image-box" id="image-box">
                <!-- Image will be inserted by JS -->
            </div>
            <!-- Buy / Sell + Description -->
            <div class="bet-right">
                <button class="mode-btn active" id="buy-btn"  onclick="setMode('Buy')">Buy</button>
                <button class="mode-btn"        id="sell-btn" onclick="setMode('Sell')">Sell</button>
                <p class="rules-text"><span>Description:</span> <span id="rules-text"></span></p>
            </div>
        </div>
        <!-- Yes / No -->
        <div class="yes-no-row">
            <div class="yes-no-col">
                <span class="chance-label" id="yes-percent-label"></span>
                <button class="choice-btn active" id="yes-btn" onclick="setChoice('Yes')"></button>
            </div>
            <div class="yes-no-col">
                <span class="chance-label" id="no-percent-label"></span>
                <button class="choice-btn" id="no-btn" onclick="setChoice('No')"></button>
            </div>
        </div>
        <!-- Amount -->
        <div class="amount-label">Amount:</div>
        <div class="amount-input-wrapper">
            <span>$</span>
            <input type="number" id="amount-input" min="0.01" step="0.01"
                   placeholder="0.00" oninput="validateAmount()" />
        </div>
        <div class="error-msg" id="amount-error">Please enter a valid amount greater than $0.00</div>
        <!-- Transaction button -->
        <button id="txn-btn" onclick="submitTransaction()">Submit</button>
    </div>
    <div class="toast" id="toast"></div>
    <script src="static/streamlit-component-lib.js?v=4"></script>
    <script src="static/main.js?v=4"></script>
</body>
</html>
